# config/task_definitions.yml
# 审计任务定义（只读配置文件，替代原数据库 task_definitions 表）
#
# 任务级字段：
#   name          — 中文任务名称（显示用）
#   dir_name      — 英文目录名（文件系统路径用）
#   description   — 任务描述
#
# 步骤级字段：
#   id                — 步骤 ID（与前端 workflowTasks 步骤对应）
#   allow_llm         — 该步骤是否允许调用 LLM
#   allow_script      — 该步骤是否可直接调用预置脚本
#   allow_scripts_list — 可选预置脚本/解析器列表，每项为 {id, label}，id 须与后端路由一一对应

tasks:
  - name: 序时账银行流水匹配
    dir_name: bank_ledger_match
    description: "Detect扫描→LLM识别→确认配置→清洗银行流水→清洗序时账→核查→匹配→人工复核→填入底稿"
    steps:
      - id: detect
        allow_llm: true
        allow_script: true
        allow_scripts_list:
          - id: script
            label: "脚本识别"
      - id: confirm
        allow_llm: false
        allow_script: false
      - id: clean-bank
        allow_llm: true
        allow_script: false
        allow_scripts_list:
          - id: icbc_historydetail
            label: "ICBC 历史明细"
          - id: generated_bank
            label: "预生成解析器"
      - id: clean-ledger
        allow_llm: true
        allow_script: true
        allow_scripts_list:
          - id: xinjiyuan_bank_ledger
            label: "新纪元银行账"
      - id: check
        allow_llm: false
        allow_script: false
      - id: match
        allow_llm: false
        allow_script: true
        allow_scripts_list:
          - id: llm_init
            label: "从clean_bank和clean_ledger匹配"
          - id: llm_step_once
            label: "从unmatched匹配（仅简单样本）"
          - id: llm_step_all
            label: "从unmatched匹配（全部候选）"
      - id: verify
        allow_llm: false
        allow_script: false
      - id: fill
        allow_llm: true
        allow_script: true
        allow_scripts_list:
          - id: script
            label: "脚本填表"

  - name: 出库结算匹配
    dir_name: outbound_settlement_match
    description: "Detect扫描→清洗结算流水→清洗出库表→匹配出库与结算"
    steps:
      - id: osm-detect
        allow_llm: false
        allow_script: false
      - id: clean-settlement
        allow_llm: true
        allow_script: false
      - id: clean-outbound
        allow_llm: true
        allow_script: false
      - id: match
        allow_llm: true
        allow_script: false

