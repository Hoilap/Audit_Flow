<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AuditFlow Desktop</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' http://127.0.0.1:8001">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="install-overlay" style="position:fixed;inset:0;z-index:9999;display:none;background:rgba(17,24,39,.96);color:#e5e7eb;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center;padding:24px;">
      <div style="width:44px;height:44px;border:4px solid rgba(255,255,255,.18);border-top-color:#3b82f6;border-radius:50%;animation:install-spin 1s linear infinite;"></div>
      <div style="margin-top:24px;font-size:18px;font-weight:600;">正在安装运行环境</div>
      <div style="margin-top:10px;font-size:13px;color:#9ca3af;max-width:420px;line-height:1.6;">首次运行需要离线安装 Python 依赖（约 2–3 分钟），<br>安装完成后会自动进入工作台，请勿关闭窗口。</div>
    </div>
    <style>@keyframes install-spin{to{transform:rotate(360deg)}}</style>

    <div class="app-shell">
      <header class="status-bar">
        <div class="status-left">
          <span id="agent-dot" class="status-dot"></span>
          <strong id="agent-status">Agent Idle</strong>
          <div class="progress-track"><div id="agent-progress" class="progress-fill"></div></div>
          <button id="stop-task" class="stop-btn" title="停止当前任务" style="display:none">■ 停止</button>
          <span id="elapsed" class="metric-inline">00:00</span>
          <span id="tokens" class="metric-inline">0 tokens</span>
          <span id="status-model" class="metric-inline">qwen3.7</span>
        </div>
        <div class="status-right">
          <button id="theme-toggle" class="ghost" title="切换深色模式">深色</button>
          <button id="refresh-all" class="ghost">刷新</button>
        </div>
      </header>

      <div class="layout" id="layout">
        <aside class="sidebar" id="sidebar">
          <div class="brand">
            <div class="brand-title">AuditFlow</div>
            <div class="brand-subtitle">智能审计工作流桌面端</div>
          </div>
          <nav class="nav" id="nav"></nav>
          <div class="sidebar-footer">
            <div class="model-card">
              <div class="label">当前模型</div>
              <select id="model-select">
                <option value="">加载中...</option>
              </select>
            </div>
            <button id="commit-all" title="提交当前证据链">提交当前证据链</button>
          </div>
        </aside>

        <div class="resize-handle handle-left" id="handle-left" title="拖拽调整左栏宽度，双击复位"></div>

        <main class="main" id="main"></main>

        <div class="resize-handle handle-right" id="handle-right" title="拖拽调整右栏宽度，双击复位"></div>

        <aside class="evidence" id="evidence">
          <div class="evidence-header">
            <div>
              <strong>审计证据链</strong>
              <div class="label">执行过程与输出文件</div>
            </div>
            <button id="refresh-files" class="ghost">刷新</button>
          </div>
          <div class="evidence-body" id="evidence-body">
            <!-- 由 config.evidencePanelSections 动态渲染 -->
          </div>
        </aside>

      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
